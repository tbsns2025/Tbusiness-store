<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لوحة تحكم Tbusiness</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;800&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#081226; --navy-2:#0B1A33; --blue:#2E6BE8; --blue-light:#7FB0FF;
    --silver:#C9D3E0; --amber:#E8A33D; --off:#F7F9FC; --ink:#0B1A33; --muted:#5B6B8C;
    --danger:#D9534F;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{font-family:'Tajawal',sans-serif; background:var(--off); color:var(--ink); min-height:100vh;}
  h1,h2,h3,.brand{font-family:'Cairo',sans-serif;}
  button{font-family:inherit; cursor:pointer;}
  input,select,textarea{font-family:inherit;}

  #loginScreen{
    min-height:100vh; display:flex; align-items:center; justify-content:center;
    background:radial-gradient(circle at 30% 20%, #10306B 0%, var(--navy) 60%);
    padding:24px;
  }
  .login-card{
    background:#fff; border-radius:20px; padding:40px 28px; text-align:center;
    max-width:360px; width:100%; box-shadow:0 30px 60px rgba(0,0,0,.3);
  }
  .login-card .logo-badge{
    width:64px; height:64px; border-radius:16px; margin:0 auto 18px;
    background:linear-gradient(135deg, var(--blue-light), var(--blue) 60%, var(--navy));
    display:flex; align-items:center; justify-content:center;
    color:#fff; font-family:'Cairo',sans-serif; font-weight:800; font-size:22px;
  }
  .login-card h2{font-size:20px; margin-bottom:8px;}
  .login-card p{color:var(--muted); font-size:13.5px; margin-bottom:26px;}
  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:8px;
    padding:14px 22px; border-radius:12px; border:none; font-weight:700; font-size:14.5px;
  }
  .btn-primary{background:var(--amber); color:#2B1A02; width:100%;}
  .btn-secondary{background:#EAF1FF; color:var(--blue);}

  #app{display:none;}
  header.top{
    background:linear-gradient(90deg, var(--navy) 0%, var(--blue) 55%, var(--amber) 130%);
    color:#fff; padding:20px 20px 46px;
  }
  header.top .row{display:flex; align-items:center; justify-content:space-between;}
  header.top .brand{font-size:19px; font-weight:800; display:flex; align-items:center; gap:10px;}
  header.top .brand .dot{width:10px; height:10px; border-radius:50%; background:#7CFFB2;}
  .logout-btn{background:rgba(255,255,255,.15); color:#fff; border:none; border-radius:10px; padding:8px 14px; font-size:12.5px; font-weight:700;}
  header.top p{opacity:.85; font-size:13px; margin-top:4px;}

  .tabs{
    display:flex; gap:10px; margin:-30px 16px 0; position:relative; z-index:2;
    background:#fff; border-radius:16px; padding:8px; box-shadow:0 10px 24px rgba(11,26,51,.12);
  }
  .tab-btn{
    flex:1; border:none; background:none; padding:12px 8px; border-radius:10px;
    font-weight:700; font-size:13.5px; color:var(--muted);
  }
  .tab-btn.active{background:var(--navy); color:#fff;}

  main{padding:24px 16px 60px; max-width:640px; margin:0 auto;}
  .section-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:16px;}
  .section-head h3{font-size:17px;}
  .count-pill{background:#EAF1FF; color:var(--blue); font-size:12px; font-weight:800; padding:3px 10px; border-radius:999px;}

  .card{
    background:#fff; border:1px solid #E7EBF3; border-radius:16px; padding:16px; margin-bottom:14px;
    box-shadow:0 4px 14px rgba(11,26,51,.05);
  }
  .prod-row{display:flex; gap:12px; align-items:center;}
  .prod-thumb{
    width:56px; height:56px; border-radius:12px; background:#EAF1FF; flex-shrink:0; overflow:hidden;
    display:flex; align-items:center; justify-content:center; color:var(--blue); font-size:10px;
  }
  .prod-thumb img{width:100%; height:100%; object-fit:cover;}
  .prod-info{flex:1; min-width:0;}
  .prod-info b{font-size:14px; display:block;}
  .prod-info span{font-size:12px; color:var(--muted);}
  .prod-price{font-family:'Cairo',sans-serif; font-weight:800; font-size:14px; margin-inline-start:auto; white-space:nowrap;}
  .icon-btn{width:34px; height:34px; border-radius:10px; border:none; background:#F0F2F7; font-size:14px;}
  .row-actions{display:flex; gap:6px;}

  .fab-add{
    position:fixed; bottom:22px; left:50%; transform:translateX(-50%);
    background:linear-gradient(90deg, var(--amber), #F4C265); color:#2B1A02;
    border:none; padding:14px 26px; border-radius:999px; font-weight:800; font-size:14px;
    box-shadow:0 12px 26px rgba(232,163,61,.4); z-index:20;
  }

  .modal-overlay{
    position:fixed; inset:0; background:rgba(8,18,38,.6); z-index:100; display:none;
    align-items:flex-end; justify-content:center;
  }
  .modal-overlay.open{display:flex;}
  .modal-sheet{
    background:#fff; width:100%; max-width:480px; max-height:90vh; overflow-y:auto;
    border-radius:20px 20px 0 0; padding:22px;
  }
  .modal-sheet h3{margin-bottom:16px;}
  .field{margin-bottom:14px;}
  .field label{display:block; font-size:13px; font-weight:700; margin-bottom:6px;}
  .field input, .field select, .field textarea{
    width:100%; padding:11px 14px; border-radius:10px; border:1px solid #D6DCE8; font-size:14px; outline:none;
  }
  .field input:focus, .field select:focus, .field textarea:focus{border-color:var(--blue);}
  .modal-actions{display:flex; gap:10px; margin-top:18px;}
  .modal-actions .btn{flex:1;}
  .img-preview{width:100%; height:140px; border-radius:12px; background:#EAF1FF; margin-bottom:10px; overflow:hidden; display:flex; align-items:center; justify-content:center; color:var(--blue); font-size:12px;}
  .img-preview img{width:100%; height:100%; object-fit:cover;}

  .ship-row{display:flex; align-items:center; gap:8px; padding:10px 0; border-bottom:1px solid #F0F2F7;}
  .ship-row span{flex:1; font-size:13px; font-weight:700;}
  .ship-row input{width:78px; padding:8px; border-radius:8px; border:1px solid #D6DCE8; font-size:13px; text-align:center;}

  #toast{
    position:fixed; bottom:24px; left:50%; transform:translateX(-50%);
    background:var(--navy); color:#fff; padding:12px 22px; border-radius:999px; font-size:13.5px;
    z-index:200; display:none; box-shadow:0 10px 24px rgba(0,0,0,.3);
  }
  .spinner{
    width:16px; height:16px; border-radius:50%; border:2px solid rgba(255,255,255,.4);
    border-top-color:#fff; animation:spin .7s linear infinite; display:inline-block;
  }
  @keyframes spin{to{transform:rotate(360deg);}}
  .loading-msg{text-align:center; color:var(--muted); font-size:13.5px; padding:30px 0;}
</style>
</head>
<body>

<div id="loginScreen">
  <div class="login-card">
    <div class="logo-badge">TB</div>
    <h2>لوحة تحكم Tbusiness</h2>
    <p>سجّل الدخول بحساب GitHub الخاص بالمتجر لإدارة المنتجات وأسعار التوصيل</p>
    <button class="btn btn-primary" id="loginBtn">تسجيل الدخول عبر GitHub</button>
  </div>
</div>

<div id="app">
  <header class="top">
    <div class="row">
      <div class="brand"><span class="dot"></span> Tbusiness</div>
      <button class="logout-btn" id="logoutBtn">تسجيل الخروج</button>
    </div>
    <p>لوحة تحكم المتجر</p>
  </header>

  <nav class="tabs">
    <button class="tab-btn active" data-tab="products">📦 المنتجات</button>
    <button class="tab-btn" data-tab="shipping">🚚 التوصيل</button>
    <button class="tab-btn" data-tab="settings">⚙️ الإعدادات</button>
  </nav>

  <main>
    <section id="tabProducts">
      <div class="section-head">
        <h3>قائمة المنتجات</h3>
        <span class="count-pill" id="productCount">0</span>
      </div>
      <div id="productsList"><div class="loading-msg">جارٍ التحميل…</div></div>
    </section>

    <section id="tabShipping" style="display:none;">
      <div class="section-head">
        <h3>أسعار التوصيل حسب الولاية</h3>
      </div>
      <div class="card">
        <div id="shippingList"><div class="loading-msg">جارٍ التحميل…</div></div>
        <button class="btn btn-primary" id="saveShippingBtn" style="width:100%; margin-top:14px;">حفظ كل التعديلات</button>
      </div>
    </section>

    <section id="tabSettings" style="display:none;">
      <div class="section-head">
        <h3>إعدادات الموقع العامة</h3>
      </div>
      <div class="card">
        <div class="field">
          <label>رقم واتساب استقبال الطلبات</label>
          <input type="text" id="sWhatsapp" placeholder="مثال: 213540420476 (بدون + أو أصفار في البداية)">
        </div>
        <div class="field">
          <label>البريد الإلكتروني الظاهر في الموقع</label>
          <input type="email" id="sEmail" placeholder="support@tbusiness.com">
        </div>
        <div class="field">
          <label>رقم الهاتف الظاهر في الموقع</label>
          <input type="text" id="sPhone" placeholder="+213 540 420 476">
        </div>
        <div class="field">
          <label>رابط صفحة فيسبوك (اتركه فارغًا لإخفاء الأيقونة)</label>
          <input type="url" id="sFacebook" placeholder="https://facebook.com/yourpage">
        </div>
        <div class="field">
          <label>رابط حساب إنستغرام (اتركه فارغًا لإخفاء الأيقونة)</label>
          <input type="url" id="sInstagram" placeholder="https://instagram.com/yourpage">
        </div>
        <button class="btn btn-primary" id="saveSettingsBtn" style="width:100%;">حفظ الإعدادات</button>
      </div>
    </section>
  </main>

  <button class="fab-add" id="addProductFab">+ إضافة منتج</button>
</div>

<div class="modal-overlay" id="productModal">
  <div class="modal-sheet">
    <h3 id="modalTitle">إضافة منتج جديد</h3>
    <div class="img-preview" id="imgPreview">لا توجد صورة</div>
    <div class="field">
      <label>صورة المنتج</label>
      <input type="file" id="fProductImage" accept="image/*">
    </div>
    <div class="field">
      <label>اسم المنتج</label>
      <input type="text" id="fName" placeholder="مثال: سماعات لاسلكية">
    </div>
    <div class="field">
      <label>الفئة</label>
      <select id="fCategory">
        <option>إلكترونيات</option>
        <option>أزياء</option>
        <option>المنزل والمطبخ</option>
        <option>الجمال والعناية</option>
        <option>الرياضة</option>
        <option>الألعاب</option>
      </select>
    </div>
    <div class="field">
      <label>السعر (دج)</label>
      <input type="number" id="fPrice" placeholder="0">
    </div>
    <div class="field">
      <label>السعر قبل الخصم (اختياري)</label>
      <input type="number" id="fOldPrice" placeholder="اتركه فارغًا إن لم يوجد خصم">
    </div>
    <div class="field">
      <label>وصف مختصر (اختياري)</label>
      <textarea id="fDescription" rows="2"></textarea>
    </div>
    <div class="modal-actions">
      <button class="btn btn-secondary" id="cancelProductBtn">إلغاء</button>
      <button class="btn btn-primary" id="saveProductBtn">حفظ المنتج</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
const REPO_OWNER = 'tbsns2025';
const REPO_NAME = 'Tbusiness-store';
const BRANCH = 'main';
const API_BASE = 'https://api.github.com/repos/' + REPO_OWNER + '/' + REPO_NAME;

let githubToken = localStorage.getItem('tb_admin_token') || null;
let productsData = { items: [] };
let productsSha = null;
let shippingData = { items: [] };
let shippingSha = null;
let editingIndex = null;

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.style.display = 'block';
  setTimeout(() => { t.style.display = 'none'; }, 2600);
}
function b64EncodeUnicode(str){
  return btoa(encodeURIComponent(str).replace(/%([0-9A-F]{2})/g, (m,p1) => String.fromCharCode('0x' + p1)));
}
function b64DecodeUnicode(str){
  return decodeURIComponent(atob(str).split('').map(c => '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2)).join(''));
}
function fileToBase64(file){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result.split(',')[1]);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}
async function ghRequest(path, options = {}){
  const res = await fetch(API_BASE + path, {
    ...options,
    headers: {
      'Authorization': 'token ' + githubToken,
      'Accept': 'application/vnd.github+json',
      ...(options.headers || {})
    }
  });
  if (!res.ok){
    const errText = await res.text();
    throw new Error('GitHub API error: ' + res.status + ' ' + errText);
  }
  return res.json();
}

document.getElementById('loginBtn').addEventListener('click', () => {
  const popup = window.open('/api/auth', 'github-oauth', 'width=600,height=700');
  window.addEventListener('message', function handler(e){
    if (typeof e.data !== 'string') return;
    if (e.data === 'authorizing:github'){
      popup.postMessage('authorizing:github', '*');
      return;
    }
    const match = e.data.match(/^authorization:github:success:(.+)$/);
    if (match){
      const payload = JSON.parse(match[1]);
      githubToken = payload.token;
      localStorage.setItem('tb_admin_token', githubToken);
      window.removeEventListener('message', handler);
      popup.close();
      initApp();
    }
  });
});

document.getElementById('logoutBtn').addEventListener('click', () => {
  localStorage.removeItem('tb_admin_token');
  githubToken = null;
  document.getElementById('app').style.display = 'none';
  document.getElementById('loginScreen').style.display = 'flex';
});

document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    const tab = btn.getAttribute('data-tab');
    document.getElementById('tabProducts').style.display = tab === 'products' ? 'block' : 'none';
    document.getElementById('tabShipping').style.display = tab === 'shipping' ? 'block' : 'none';
    document.getElementById('tabSettings').style.display = tab === 'settings' ? 'block' : 'none';
    document.getElementById('addProductFab').style.display = tab === 'products' ? 'block' : 'none';
  });
});

async function loadProducts(){
  try {
    const file = await ghRequest('/contents/data/products.json?ref=' + BRANCH);
    productsSha = file.sha;
    productsData = JSON.parse(b64DecodeUnicode(file.content));
    renderProducts();
  } catch(e){
    document.getElementById('productsList').innerHTML = '<div class="loading-msg">تعذّر تحميل المنتجات</div>';
  }
}

async function loadShipping(){
  try {
    const file = await ghRequest('/contents/data/shipping.json?ref=' + BRANCH);
    shippingSha = file.sha;
    shippingData = JSON.parse(b64DecodeUnicode(file.content));
    renderShipping();
  } catch(e){
    document.getElementById('shippingList').innerHTML = '<div class="loading-msg">تعذّر تحميل أسعار التوصيل</div>';
  }
}

function renderProducts(){
  const list = document.getElementById('productsList');
  const items = productsData.items || [];
  document.getElementById('productCount').textContent = items.length;
  if (!items.length){
    list.innerHTML = '<div class="loading-msg">لا توجد منتجات بعد، اضغط "+ إضافة منتج"</div>';
    return;
  }
  list.innerHTML = items.map((p, idx) => {
    const img = p.image ? '<img src="../' + p.image + '">' : '📦';
    return (
      '<div class="card"><div class="prod-row">' +
        '<div class="prod-thumb">' + img + '</div>' +
        '<div class="prod-info"><b>' + (p.name||'') + '</b><span>' + (p.category||'') + '</span></div>' +
        '<div class="prod-price">' + (p.price||0).toLocaleString('ar-DZ') + ' دج</div>' +
        '<div class="row-actions">' +
          '<button class="icon-btn" data-edit="' + idx + '">✏️</button>' +
          '<button class="icon-btn" data-delete="' + idx + '">🗑️</button>' +
        '</div>' +
      '</div></div>'
    );
  }).join('');

  list.querySelectorAll('[data-edit]').forEach(b => b.addEventListener('click', () => openProductModal(Number(b.getAttribute('data-edit')))));
  list.querySelectorAll('[data-delete]').forEach(b => b.addEventListener('click', () => deleteProduct(Number(b.getAttribute('data-delete')))));
}

function renderShipping(){
  const list = document.getElementById('shippingList');
  const items = shippingData.items || [];
  list.innerHTML = items.map((w, idx) => (
    '<div class="ship-row">' +
      '<span>' + w.wilaya + '</span>' +
      '<input type="number" data-home="' + idx + '" value="' + w.home_price + '" placeholder="منزل">' +
      '<input type="number" data-office="' + idx + '" value="' + w.office_price + '" placeholder="مكتب">' +
    '</div>'
  )).join('');
}

document.getElementById('saveShippingBtn').addEventListener('click', async () => {
  document.querySelectorAll('[data-home]').forEach(inp => {
    shippingData.items[Number(inp.getAttribute('data-home'))].home_price = Number(inp.value) || 0;
  });
  document.querySelectorAll('[data-office]').forEach(inp => {
    shippingData.items[Number(inp.getAttribute('data-office'))].office_price = Number(inp.value) || 0;
  });
  try {
    const content = b64EncodeUnicode(JSON.stringify(shippingData, null, 2));
    const res = await ghRequest('/contents/data/shipping.json', {
      method: 'PUT',
      body: JSON.stringify({
        message: 'تحديث أسعار التوصيل عبر لوحة التحكم',
        content: content,
        sha: shippingSha,
        branch: BRANCH
      })
    });
    shippingSha = res.content.sha;
    showToast('تم حفظ أسعار التوصيل بنجاح');
  } catch(e){
    showToast('حدث خطأ أثناء الحفظ');
  }
});

const productModal = document.getElementById('productModal');
document.getElementById('addProductFab').addEventListener('click', () => openProductModal(null));
document.getElementById('cancelProductBtn').addEventListener('click', () => productModal.classList.remove('open'));

function openProductModal(idx){
  editingIndex = idx;
  const p = idx !== null ? productsData.items[idx] : {};
  document.getElementById('modalTitle').textContent = idx !== null ? 'تعديل المنتج' : 'إضافة منتج جديد';
  document.getElementById('fName').value = p.name || '';
  document.getElementById('fCategory').value = p.category || 'إلكترونيات';
  document.getElementById('fPrice').value = p.price || '';
  document.getElementById('fOldPrice').value = p.old_price || '';
  document.getElementById('fDescription').value = p.description || '';
  document.getElementById('fProductImage').value = '';
  const preview = document.getElementById('imgPreview');
  preview.innerHTML = p.image ? '<img src="../' + p.image + '">' : 'لا توجد صورة';
  productModal.classList.add('open');
}

document.getElementById('fProductImage').addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    document.getElementById('imgPreview').innerHTML = '<img src="' + reader.result + '">';
  };
  reader.readAsDataURL(file);
});

document.getElementById('saveProductBtn').addEventListener('click', async () => {
  const btn = document.getElementById('saveProductBtn');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span> جارٍ الحفظ';
  try {
    let imagePath = editingIndex !== null ? (productsData.items[editingIndex].image || '') : '';
    const file = document.getElementById('fProductImage').files[0];
    if (file){
      const base64 = await fileToBase64(file);
      const safeName = Date.now() + '-' + file.name.replace(/[^a-zA-Z0-9.\-]/g, '_');
      const path = 'images/products/' + safeName;
      await ghRequest('/contents/' + path, {
        method: 'PUT',
        body: JSON.stringify({
          message: 'رفع صورة منتج عبر لوحة التحكم',
          content: base64,
          branch: BRANCH
        })
      });
      imagePath = path;
    }

    const newProduct = {
      name: document.getElementById('fName').value.trim(),
      category: document.getElementById('fCategory').value,
      price: Number(document.getElementById('fPrice').value) || 0,
      old_price: document.getElementById('fOldPrice').value ? Number(document.getElementById('fOldPrice').value) : null,
      image: imagePath,
      description: document.getElementById('fDescription').value.trim()
    };

    if (editingIndex !== null){
      productsData.items[editingIndex] = newProduct;
    } else {
      productsData.items.push(newProduct);
    }

    const content = b64EncodeUnicode(JSON.stringify(productsData, null, 2));
    const res = await ghRequest('/contents/data/products.json', {
      method: 'PUT',
      body: JSON.stringify({
        message: 'تحديث المنتجات عبر لوحة التحكم',
        content: content,
        sha: productsSha,
        branch: BRANCH
      })
    });
    productsSha = res.content.sha;

    productModal.classList.remove('open');
    renderProducts();
    showToast('تم حفظ المنتج بنجاح');
  } catch(e){
    showToast('حدث خطأ أثناء الحفظ');
  } finally {
    btn.disabled = false;
    btn.innerHTML = 'حفظ المنتج';
  }
});

async function deleteProduct(idx){
  if (!confirm('هل أنت متأكد من حذف هذا المنتج؟')) return;
  productsData.items.splice(idx, 1);
  try {
    const content = b64EncodeUnicode(JSON.stringify(productsData, null, 2));
    const res = await ghRequest('/contents/data/products.json', {
      method: 'PUT',
      body: JSON.stringify({
        message: 'حذف منتج عبر لوحة التحكم',
        content: content,
        sha: productsSha,
        branch: BRANCH
      })
    });
    productsSha = res.content.sha;
    renderProducts();
    showToast('تم حذف المنتج');
  } catch(e){
    showToast('حدث خطأ أثناء الحذف');
  }
}

let settingsData = {};
let settingsSha = null;

async function loadSettings(){
  try {
    const file = await ghRequest('/contents/data/settings.json?ref=' + BRANCH);
    settingsSha = file.sha;
    settingsData = JSON.parse(b64DecodeUnicode(file.content));
    document.getElementById('sWhatsapp').value = settingsData.whatsapp_number || '';
    document.getElementById('sEmail').value = settingsData.email || '';
    document.getElementById('sPhone').value = settingsData.phone_display || '';
    document.getElementById('sFacebook').value = settingsData.facebook_url || '';
    document.getElementById('sInstagram').value = settingsData.instagram_url || '';
  } catch(e){
    showToast('تعذّر تحميل الإعدادات');
  }
}

document.getElementById('saveSettingsBtn').addEventListener('click', async () => {
  const newSettings = {
    whatsapp_number: document.getElementById('sWhatsapp').value.trim(),
    email: document.getElementById('sEmail').value.trim(),
    phone_display: document.getElementById('sPhone').value.trim(),
    facebook_url: document.getElementById('sFacebook').value.trim(),
    instagram_url: document.getElementById('sInstagram').value.trim()
  };
  try {
    const content = b64EncodeUnicode(JSON.stringify(newSettings, null, 2));
    const res = await ghRequest('/contents/data/settings.json', {
      method: 'PUT',
      body: JSON.stringify({
        message: 'تحديث إعدادات الموقع عبر لوحة التحكم',
        content: content,
        sha: settingsSha,
        branch: BRANCH
      })
    });
    settingsSha = res.content.sha;
    settingsData = newSettings;
    showToast('تم حفظ الإعدادات بنجاح');
  } catch(e){
    showToast('حدث خطأ أثناء الحفظ');
  }
});

function initApp(){
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  loadProducts();
  loadShipping();
  loadSettings();
}

if (githubToken){
  initApp();
}
</script>
