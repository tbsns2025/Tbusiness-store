<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#2B0F28">
<title>إدارة المتجر — TBusiness</title>
<link rel="icon" href="../logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F3F1F2; --card:#fff; --b:#E5E0E3; --b2:#D6CFD3;
  --ink:#1F1A1D; --ink2:#5C565A; --ink3:#958E92;
  --brand:#E83E7A; --brand-d:#C2245D; --brand-l:#FDE8EF; --plum:#2B0F28; --plum2:#3D1838;
  --ok:#14805E; --ok-l:#DDF3EA; --warn:#9A6400; --warn-l:#FFF1D2; --bad:#C9303A; --bad-l:#FCE4E5; --info-l:#E9E4FF;
  --r:14px; --sh:0 1px 0 rgba(0,0,0,.04),0 1px 3px rgba(0,0,0,.06);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{font-family:'IBM Plex Sans Arabic',system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.55;min-height:100vh}
button,input,select,textarea{font-family:inherit;color:inherit;font-size:inherit}
button{cursor:pointer;border:none;background:none}
a{color:inherit;text-decoration:none}
svg{width:1em;height:1em;flex-shrink:0}
.ic{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.hide{display:none!important}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}

/* login */
#login{min-height:100vh;display:grid;place-items:center;padding:24px;background:var(--plum)}
.lc{background:#fff;border-radius:20px;padding:34px 26px;max-width:380px;width:100%;text-align:center}
.lc .lg{width:60px;height:60px;border-radius:16px;background:var(--brand);color:#fff;display:grid;place-items:center;font-weight:700;font-size:26px;margin:0 auto 14px}
.lc h1{font-size:20px}
.lc p{color:var(--ink2);margin:6px 0 22px;font-size:13.5px}
.lc .tip{font-size:12px;color:var(--ink3);margin-top:14px}

/* shell */
.app{display:flex;min-height:100vh}
.side{width:240px;background:var(--plum);color:#E9DDE6;position:fixed;top:0;bottom:0;right:0;display:none;flex-direction:column;padding:16px 12px;z-index:30}
.side .st{display:flex;align-items:center;gap:10px;padding:6px 8px 18px}
.side .st i{width:36px;height:36px;border-radius:10px;background:var(--brand);color:#fff;display:grid;place-items:center;font-style:normal;font-weight:700;font-size:17px;overflow:hidden}
.side .st i img{width:100%;height:100%;object-fit:cover}
.side .st b{display:block;color:#fff;font-size:15px}
.side .st small{font-size:11.5px;opacity:.65}
.nav a{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;font-weight:600;font-size:14px;margin-bottom:2px;color:#D7C7D3}
.nav a svg{font-size:19px}
.nav a:hover{background:rgba(255,255,255,.06)}
.nav a.on{background:rgba(255,255,255,.12);color:#fff}
.side .foot{margin-top:auto;font-size:12.5px}
.side .foot a,.side .foot button{display:flex;align-items:center;gap:8px;padding:9px 12px;border-radius:10px;color:#D7C7D3;width:100%}
.side .foot a:hover,.side .foot button:hover{background:rgba(255,255,255,.06)}
.main{flex:1;min-width:0;padding-bottom:90px}
.top{position:sticky;top:0;z-index:20;background:var(--plum);color:#fff;display:flex;align-items:center;gap:10px;padding:10px 14px}
.top b{flex:1;font-size:16px;font-weight:700}
.top a,.top button{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;background:rgba(255,255,255,.12);padding:7px 11px;border-radius:9px;color:#fff}
.view{max-width:980px;margin:0 auto;padding:18px 14px}
.bnav{position:fixed;bottom:0;left:0;right:0;z-index:25;background:#fff;border-top:1px solid var(--b);display:flex;padding:4px 4px calc(4px + env(safe-area-inset-bottom))}
.bnav a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;font-size:10.5px;font-weight:600;color:var(--ink3)}
.bnav a svg{font-size:22px}
.bnav a.on{color:var(--brand-d)}
@media(min-width:900px){
  .side{display:flex}.main{margin-right:240px;padding-bottom:40px}.top,.bnav{display:none}
  .view{padding:28px 32px}
}

/* page header */
.ph{display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.ph h1{font-size:21px;font-weight:700;flex:1;display:flex;align-items:center;gap:10px;min-width:0}
.ph .back{width:36px;height:36px;border-radius:10px;background:#fff;border:1px solid var(--b);display:grid;place-items:center;font-size:18px;flex-shrink:0}
.ph .sub{font-size:13px;color:var(--ink2);width:100%}

/* cards */
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);border:1px solid var(--b);margin-bottom:14px}
.card>.hd{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px 0}
.card>.hd h2{font-size:15px;font-weight:700}
.card>.hd .lnk{font-size:13px;font-weight:600;color:var(--brand-d)}
.card>.bd{padding:14px 16px 16px}
.card .muted{font-size:12.5px;color:var(--ink2)}
.cols{display:grid;gap:14px}
@media(min-width:900px){.cols.ed{grid-template-columns:1fr 320px;align-items:start}.cols.ed .aside{position:sticky;top:20px}}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:9px 14px;border-radius:10px;font-weight:600;font-size:13.5px;border:1px solid var(--b2);background:#fff;white-space:nowrap;transition:background .15s}
.btn:hover{background:#FAF8F9}
.btn svg{font-size:17px}
.btn.pri{background:var(--plum);border-color:var(--plum);color:#fff}
.btn.pri:hover{background:var(--plum2)}
.btn.brand{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.danger{color:var(--bad);border-color:#F1C4C7}
.btn.ghost{border-color:transparent;background:transparent}
.btn.sm{padding:6px 10px;font-size:12.5px;border-radius:8px}
.btn.w{width:100%}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.lg{padding:12px 18px;font-size:14.5px;border-radius:12px}

/* forms */
.f{margin-bottom:14px}
.f:last-child{margin-bottom:0}
.f>label,.lbl{display:block;font-size:13px;font-weight:600;margin-bottom:6px}
.f .hint{font-size:12px;color:var(--ink3);margin-top:5px}
.in,.f input:not([type=checkbox]):not([type=color]):not([type=file]),.f select,.f textarea{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--b2);background:#fff;font-size:16px;outline:none;transition:border-color .15s,box-shadow .15s}
.in:focus,.f input:focus,.f select:focus,.f textarea:focus{border-color:var(--plum);box-shadow:0 0 0 3px rgba(43,15,40,.08)}
.f textarea{resize:vertical;min-height:110px;line-height:1.7}
.f.bad input{border-color:var(--bad)}
.f .err{color:var(--bad);font-size:12px;margin-top:4px;display:none}.f.bad .err{display:block}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pfx{position:relative}.pfx span{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--ink3);font-size:13px;pointer-events:none}
.pfx input{padding-left:38px!important}
.sw{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--b)}
.sw:last-child{border:none;padding-bottom:0}
.sw:first-child{padding-top:0}
.sw b{display:block;font-size:13.5px;font-weight:600}
.sw small{display:block;font-size:12px;color:var(--ink2)}
.tg{position:relative;width:44px;height:26px;flex-shrink:0}
.tg input{opacity:0;width:0;height:0;position:absolute}
.tg span{position:absolute;inset:0;border-radius:26px;background:var(--b2);transition:background .2s;cursor:pointer}
.tg span::after{content:"";position:absolute;top:3px;right:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.tg input:checked+span{background:var(--ok)}
.tg input:checked+span::after{transform:translateX(-18px)}
.seg{display:flex;background:var(--bg);border-radius:10px;padding:3px;gap:3px}
.seg button{flex:1;padding:8px 6px;border-radius:8px;font-weight:600;font-size:12.5px;color:var(--ink2)}
.seg button.on{background:#fff;color:var(--ink);box-shadow:var(--sh)}

/* badges */
.bd-s{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:2px 9px;border-radius:999px;background:var(--bg);color:var(--ink2);white-space:nowrap}
.bd-s::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.bd-s.ok{background:var(--ok-l);color:var(--ok)}.bd-s.warn{background:var(--warn-l);color:var(--warn)}.bd-s.bad{background:var(--bad-l);color:var(--bad)}.bd-s.info{background:var(--info-l);color:#5B3DC8}
.bd-s.plain::before{display:none}

/* dashboard */
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
@media(min-width:700px){.stats{grid-template-columns:repeat(4,1fr)}}
.stat{background:#fff;border:1px solid var(--b);border-radius:var(--r);padding:14px;box-shadow:var(--sh);cursor:pointer}
.stat small{font-size:12.5px;color:var(--ink2);display:flex;align-items:center;gap:6px}
.stat b{display:block;font-size:26px;font-weight:700;margin-top:4px;line-height:1.2}
.qa{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(min-width:700px){.qa{grid-template-columns:repeat(4,1fr)}}
.qa a{display:flex;flex-direction:column;gap:8px;padding:14px;border-radius:12px;background:var(--bg);font-weight:600;font-size:13px}
.qa a svg{font-size:22px;color:var(--brand-d)}
.check{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--b)}
.check:last-child{border:none}
.check i{width:24px;height:24px;border-radius:50%;border:2px dashed var(--b2);display:grid;place-items:center;flex-shrink:0;font-style:normal;color:#fff;font-size:13px}
.check.done i{background:var(--ok);border:none}
.check.done span{color:var(--ink3);text-decoration:line-through}
.check>span:not(.btn){flex:1;font-size:13.5px}
.check .btn{flex:none}
.prog{height:8px;border-radius:8px;background:var(--bg);overflow:hidden;margin-top:6px}.prog b{display:block;height:100%;background:var(--ok);border-radius:8px}

/* product list */
.toolbar{display:flex;gap:8px;flex-wrap:wrap;padding:12px 12px 0}
.toolbar .in{flex:1;min-width:170px;padding:9px 12px;font-size:15px}
.toolbar select{width:auto;padding:9px 10px;border-radius:10px;border:1px solid var(--b2);background:#fff;font-size:13.5px}
.fchips{display:flex;gap:6px;overflow-x:auto;padding:10px 12px;scrollbar-width:none;border-bottom:1px solid var(--b)}
.fchips::-webkit-scrollbar{display:none}
.fchips button{flex-shrink:0;padding:6px 12px;border-radius:8px;font-size:12.5px;font-weight:600;color:var(--ink2)}
.fchips button.on{background:var(--bg);color:var(--ink)}
.fchips button em{font-style:normal;color:var(--ink3);margin-inline-start:4px}
.bulk{display:flex;align-items:center;gap:8px;padding:10px 12px;background:var(--brand-l);border-bottom:1px solid var(--b);flex-wrap:wrap;font-size:13px;font-weight:600}
.bulk span{flex:1}
.pr{display:flex;align-items:center;gap:12px;padding:10px 12px;border-bottom:1px solid var(--b);cursor:pointer;transition:background .1s}
.pr:last-child{border:none}
.pr:hover{background:#FCFAFB}
.pr input[type=checkbox]{width:18px;height:18px;accent-color:var(--plum);flex-shrink:0}
.pr .th{width:48px;height:60px;border-radius:9px;background:var(--bg);overflow:hidden;flex-shrink:0;display:grid;place-items:center;color:var(--ink3);font-size:18px;border:1px solid var(--b)}
.pr .th img{width:100%;height:100%;object-fit:cover}
.pr .nm{flex:1;min-width:0}
.pr .nm b{display:block;font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pr .nm small{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:12px;color:var(--ink2);margin-top:3px}
.pr .pp{text-align:left;font-weight:600;font-size:13.5px;white-space:nowrap}
.pr .pp s{display:block;font-size:11.5px;color:var(--ink3);font-weight:400}
.star{color:#D8A13F}
.empty{text-align:center;padding:44px 16px;color:var(--ink2)}
.empty svg{font-size:40px;color:var(--ink3);margin-bottom:8px}
.empty b{display:block;color:var(--ink);font-size:15px;margin-bottom:4px}

/* media */
.media-g{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:10px}
.mi{position:relative;aspect-ratio:3/4;border-radius:12px;overflow:hidden;background:var(--bg);border:1px solid var(--b);cursor:grab}
.mi img{width:100%;height:100%;object-fit:cover;pointer-events:none}
.mi.first{grid-column:span 2;grid-row:span 2}
.mi .tools{position:absolute;top:6px;left:6px;right:6px;display:flex;justify-content:space-between}
.mi .tools button{width:28px;height:28px;border-radius:8px;background:rgba(255,255,255,.95);display:grid;place-items:center;font-size:14px;box-shadow:var(--sh)}
.mi .main-t{position:absolute;bottom:6px;right:6px;font-size:11px;font-weight:700;background:var(--plum);color:#fff;padding:1px 8px;border-radius:6px}
.mi.drag{opacity:.4}.mi.over{outline:2px dashed var(--brand)}
.mi .up{position:absolute;inset:0;background:rgba(255,255,255,.7);display:grid;place-items:center;font-size:12px;font-weight:700}
.drop{aspect-ratio:3/4;border-radius:12px;border:2px dashed var(--b2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center;font-size:12.5px;font-weight:600;color:var(--ink2);cursor:pointer;padding:8px;transition:border-color .15s,background .15s}
.drop:hover,.drop.over{border-color:var(--brand);background:var(--brand-l)}
.drop svg{font-size:24px}
.drop input{display:none}

/* tags input */
.tags{display:flex;flex-wrap:wrap;gap:6px;padding:7px;border:1px solid var(--b2);border-radius:10px;background:#fff;min-height:46px;align-items:center;cursor:text}
.tags:focus-within{border-color:var(--plum);box-shadow:0 0 0 3px rgba(43,15,40,.08)}
.tags .t{display:inline-flex;align-items:center;gap:6px;background:var(--bg);border:1px solid var(--b);border-radius:8px;padding:4px 6px 4px 10px;font-size:13px;font-weight:600}
.tags .t i{width:14px;height:14px;border-radius:50%;border:1px solid rgba(0,0,0,.15);display:inline-block}
.tags .t button{width:20px;height:20px;border-radius:6px;display:grid;place-items:center;color:var(--ink3);font-size:13px}
.tags .t button:hover{background:var(--b);color:var(--ink)}
.tags input{flex:1;min-width:110px;border:none!important;outline:none;padding:5px!important;box-shadow:none!important;font-size:15px}
.presets{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.presets button{padding:6px 11px;border-radius:8px;border:1px dashed var(--b2);font-size:12.5px;font-weight:600;color:var(--ink2);background:#fff}
.presets button:hover{border-color:var(--plum);color:var(--ink)}
.presets .t{font-size:12px;color:var(--ink3);width:100%}
.vt{width:100%;border-collapse:collapse;margin-top:12px;font-size:13.5px}
.vt th{text-align:right;font-weight:600;font-size:12px;color:var(--ink2);padding:6px 4px;border-bottom:1px solid var(--b)}
.vt td{padding:7px 4px;border-bottom:1px solid var(--b)}
.vt tr:last-child td{border:none}
.vt input{width:90px;padding:7px 8px;border-radius:8px;border:1px solid var(--b2);font-size:15px;text-align:center}
.cl{display:flex;flex-direction:column;gap:8px}
.crow{display:flex;align-items:center;gap:8px}
.crow input[type=color]{width:40px;height:40px;border:1px solid var(--b2);border-radius:10px;padding:2px;background:#fff;cursor:pointer;flex-shrink:0}
.crow .in{flex:1}
.crow button{width:36px;height:36px;border-radius:9px;display:grid;place-items:center;color:var(--ink3)}
.crow button:hover{background:var(--bg);color:var(--bad)}
.swatches{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.swatches button{display:inline-flex;align-items:center;gap:6px;padding:5px 10px 5px 8px;border:1px solid var(--b);border-radius:999px;font-size:12px;font-weight:600;background:#fff}
.swatches button i{width:14px;height:14px;border-radius:50%;border:1px solid rgba(0,0,0,.15)}

/* preview card */
.pv{border-radius:14px;overflow:hidden;background:#FFF6F9;padding:12px}
.pv .im{aspect-ratio:3/4;border-radius:16px;background:#FFE3EC;overflow:hidden;display:grid;place-items:center;color:#C9A3B6;font-size:34px;position:relative}
.pv .im img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.pv .im .tag{position:absolute;top:8px;right:8px;background:#E83E7A;color:#fff;font-size:11px;font-weight:700;padding:2px 9px;border-radius:999px}
.pv b{display:block;margin-top:8px;font-size:13.5px}
.pv .p{color:#C2245D;font-weight:700}
.pv .p s{color:#A891A3;font-weight:400;font-size:12px;margin-inline-start:6px}

/* shipping */
.st-row{display:grid;grid-template-columns:1fr 78px 78px 40px;gap:6px;align-items:center;padding:7px 12px;border-bottom:1px solid var(--b)}
.st-row:last-child{border:none}
.st-row.h{font-size:12px;font-weight:600;color:var(--ink2);background:#FAF8F9;position:sticky;top:0}
.st-row span{font-size:13.5px;font-weight:600;min-width:0}
.st-row span small{color:var(--ink3);font-weight:400;font-size:11.5px}
.st-row input{width:100%;padding:7px 4px;border-radius:8px;border:1px solid var(--b2);text-align:center;font-size:15px}
.st-row.off span{color:var(--ink3);text-decoration:line-through}
.st-row.off input{opacity:.4}
.st-row .tg{width:36px;height:22px}.st-row .tg span::after{width:16px;height:16px}.st-row .tg input:checked+span::after{transform:translateX(-14px)}

/* categories */
.cr{display:flex;align-items:center;gap:12px;padding:10px 12px;border-bottom:1px solid var(--b)}
.cr:last-child{border:none}
.cr .ci{width:52px;height:52px;border-radius:50%;background:var(--bg);overflow:hidden;flex-shrink:0;display:grid;place-items:center;color:var(--ink3);font-size:11px;border:1px solid var(--b);cursor:pointer;position:relative}
.cr .ci img{width:100%;height:100%;object-fit:cover}
.cr .ci input{display:none}
.cr .in{flex:1;min-width:0}
.cr small{font-size:12px;color:var(--ink3);white-space:nowrap}
.cr .ord{display:flex;flex-direction:column}
.cr .ord button{width:28px;height:22px;display:grid;place-items:center;color:var(--ink2)}

/* faq editor */
.fq{border:1px solid var(--b);border-radius:12px;padding:10px;margin-bottom:10px;background:#FCFAFB}
.fq .in{margin-bottom:6px}
.fq textarea.in{min-height:64px;resize:vertical}
.fq .r{display:flex;justify-content:flex-end;gap:6px}
.accents{display:flex;gap:10px;flex-wrap:wrap}
.accents button{width:38px;height:38px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1px var(--b2)}
.accents button.on{box-shadow:0 0 0 2px var(--ink)}
.logo-up{display:flex;align-items:center;gap:14px}
.logo-up .lp{width:64px;height:64px;border-radius:50%;background:var(--bg);border:1px solid var(--b);overflow:hidden;display:grid;place-items:center;color:var(--ink3);font-size:12px}
.logo-up .lp img{width:100%;height:100%;object-fit:cover}

/* save bar */
.savebar{position:fixed;top:0;left:0;right:0;z-index:60;background:var(--ink);color:#fff;display:flex;align-items:center;gap:10px;padding:10px 14px calc(10px);transform:translateY(-110%);transition:transform .25s}
.savebar.show{transform:none}
.savebar span{flex:1;font-size:13.5px;font-weight:600;display:flex;align-items:center;gap:8px}
.savebar .btn{border-color:transparent}
.savebar .btn.ghost{color:#fff;background:rgba(255,255,255,.12)}
.savebar .btn.brand{background:#fff;color:var(--ink)}
@media(min-width:900px){.savebar{right:240px}}
.spin{width:15px;height:15px;border-radius:50%;border:2px solid currentColor;border-top-color:transparent;animation:sp .7s linear infinite;display:inline-block}
@keyframes sp{to{transform:rotate(360deg)}}

/* ---------- GitHub ---------- */
let token = null;

const enc = s => btoa(unescape(encodeURIComponent(s)));
const dec = s => decodeURIComponent(escape(atob(String(s).replace(/\n/g, ''))));
async function gh(path, opt = {}){
  const r = await fetch(API + path, {...opt, headers: {'Authorization': 'token ' + token, 'Accept': 'application/vnd.github+json', ...(opt.headers || {})}});
  if (r.status === 401){ logout(); throw new Error('401'); }
  if (!r.ok){ const e = new Error(r.status + ' ' + (await r.text()).slice(0, 200)); e.status = r.status; throw e; }
  return r.status === 204 ? null : r.json();
}
async function readJSON(path){
  try { const f = await gh('/contents/' + path + '?ref=' + BRANCH + '&t=' + Date.now()); return JSON.parse(dec(f.content)); }
  catch(e){ if (e.status === 404) return null; throw e; }
}
async function currentSha(path){ try { return (await gh('/contents/' + path + '?ref=' + BRANCH + '&t=' + Date.now())).sha; } catch(e){ return undefined; } }
async function writeFile(path, b64, msg){
  for (let k = 0; k < 2; k++){
    try { return await gh('/contents/' + path, {method:'PUT', body: JSON.stringify({message: msg, content: b64, sha: await currentSha(path), branch: BRANCH})}); }
    catch(e){ if (e.status !== 409 || k) throw e; }
  }
}
const writeJSON = (path, obj, msg) => writeFile(path, enc(JSON.stringify(obj, null, 2)), msg);
function shrink(file, max = 1600, q = .85){
  return new Promise((res, rej) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const k = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height); x.drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url); res(c.toDataURL('image/jpeg', q));
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('img')); };
    img.src = url;
  });
}
async function uploadImage(dataUrl, folder){
  const path = (folder || 'images/products') + '/' + Date.now() + '-' + Math.random().toString(36).slice(2, 7) + '.jpg';

}

  const rows = DHD_TABLE.map(([c, n, h, o]) => ({code: c, wilaya: n, home_price: h, office_price: o, enabled: true}));
  NEW_WILAYAS.forEach(([n, par]) => { const p = rows.find(r => r.wilaya === par); if (p) rows.push({wilaya: n, home_price: p.home_price, office_price: p.office_price, is_new: true, enabled: true}); });
  return rows;
}
async function loadAll(){
  const [p, c, s, st] = await Promise.all(['products', 'categories', 'shipping', 'settings'].map(n => readJSON('data/' + n + '.json')));
  DB.products = ((p && p.items) || []).map((x, i) => Object.assign({id: x.id || ('p' + i + Date.now().toString(36))}, x));
  DB.categories = (c && c.items) || [];
  DB.shipSaved = !!(s && num(s.version) >= 2);
  DB.shipping = DB.shipSaved ? s.items.map(w => Object.assign({enabled: true}, w)) : dhdRows();
  DB.settings = st || {};
  applyBrand();
}

async function saveProducts(mutator, msg){
  const fresh = await readJSON('data/products.json');
  let items = ((fresh && fresh.items) || DB.products).map(x => x);
  items = mutator(items) || items;
  await writeJSON('data/products.json', {items}, msg);
  DB.products = items;
}

    if (typeof e.data !== 'string') return;
    if (e.data === 'authorizing:github'){ popup && popup.postMessage('authorizing:github', '*'); return; }
    const m = e.data.match(/^authorization:github:success:(.+)$/);
    if (m){ token = JSON.parse(m[1]).token; try { localStorage.setItem('tb_admin_token', token); } catch(_){} window.removeEventListener('message', h); popup && popup.close(); boot(); }
  });
});

let lastHash = location.hash || '#/', guard = false;
window.addEventListener('hashchange', async () => {
  if (guard){ guard = false; return; }
  if (dirty){
    const leave = await ask('لديك تغييرات غير محفوظة', 'إذا خرجت الآن ستضيع هذه التغييرات.', 'خروج بدون حفظ', true);
    if (!leave){ guard = true; location.hash = lastHash; return; }
    setDirty(null);
  }
  route();
});
function go(h){ location.hash = h; }
function route(){
  const h = location.hash || '#/';
  lastHash = h;
  const base = '#/' + (h.split('/')[1] || '');
  document.querySelectorAll('[data-r]').forEach(a => a.classList.toggle('on', a.dataset.r === (base === '#/product' ? '#/products' : base)));
  const nav = NAV.find(n => n[0] === base);
  $('topTitle').textContent = nav ? nav[2] : 'المنتجات';
  const v = $('view');
  window.scrollTo(0, 0);
  if (h.startsWith('#/product/')) pageEditor(decodeURIComponent(h.slice(10)));
  else if (base === '#/products') pageProducts();
  else if (base === '#/categories') pageCategories();
  else if (base === '#/shipping') pageShipping();
  else if (base === '#/design') pageDesign();
  else if (base === '#/settings') pageSettings();
  else pageHome();
  paintIcons(v);
}

function pageHome(){

  const active = P.filter(p => !isHidden(p)).length, out = P.filter(isOut).length, low = P.filter(isLow).length, sale = P.filter(onSale).length;
  const checks = [
    [P.length >= 1, 'أضف أول منتج', '#/product/new'],
    [P.filter(p => imgsOf(p).length).length >= Math.min(P.length, 1) && P.length > 0, 'ضع صورًا لمنتجاتك', '#/products'],
    [DB.categories.length >= 2, 'نظّم المنتجات في فئات', '#/categories'],
    [DB.shipSaved, 'احفظ أسعار التوصيل', '#/shipping'],
    [!!s.logo, 'ارفع شعار المتجر', '#/design'],
    [!!(s.whatsapp_number), 'تأكد من رقم واتساب الطلبات', '#/settings'],

  ];

    '</div>' +
    (doneN < checks.length ? '<div class="card"><div class="hd"><h2>جهّز متجرك</h2><span class="muted">' + doneN + ' من ' + checks.length + '</span></div><div class="bd"><div class="prog"><b style="width:' + Math.round(doneN / checks.length * 100) + '%"></b></div>' +

    '</div></div></div>' +

function statusBadges(p){
  let b = '';
  if (isHidden(p)) b += '<span class="bd-s">مخفي</span>';
  else b += '<span class="bd-s ok">معروض</span>';
  if (isOut(p)) b += '<span class="bd-s bad">نفد</span>';
  else if (isLow(p)) b += '<span class="bd-s warn">بقي ' + num(p.stock) + '</span>';
  if (onSale(p)) b += '<span class="bd-s info plain">-' + Math.round((1 - num(p.price) / num(p.old_price)) * 100) + '%</span>';
  return b;
}
function rowHTML(p, sel){
  const im = imgsOf(p)[0];
  return '<div class="pr" data-id="' + esc(p.id) + '">' + (sel !== undefined ? '<input type="checkbox" data-sel="' + esc(p.id) + '"' + (sel ? ' checked' : '') + ' aria-label="تحديد">' : '') +
    '<div class="th">' + (im ? '<img src="' + esc(src(im)) + '" loading="lazy" alt="">' : I.img) + '</div>' +
    '<div class="nm"><b>' + (p.featured ? '<span class="star">' + I.star + '</span> ' : '') + esc(p.name) + '</b><small>' + esc(p.category || 'بدون فئة') + ' ' + statusBadges(p) + '</small></div>' +
    '<div class="pp">' + money(p.price) + (onSale(p) ? '<s>' + money(p.old_price) + '</s>' : '') + '</div></div>';
}
let PL = {q: '', f: 'all', cat: '', sel: new Set()};
function pageProducts(){
  const qs = new URLSearchParams((location.hash.split('?')[1]) || '');
  if (qs.get('f')) PL.f = qs.get('f');
  const P = DB.products;
  const cats = [...new Set(P.map(p => p.category).filter(Boolean))];
  const F = [['all', 'الكل', () => true], ['active', 'معروض', p => !isHidden(p)], ['hidden', 'مخفي', isHidden], ['out', 'نفد', isOut], ['low', 'كمية قليلة', isLow], ['sale', 'تخفيض', onSale], ['featured', 'مميّز', p => !!p.featured], ['noimg', 'بدون صور', p => !imgsOf(p).length]];
  $('view').innerHTML =
    '<div class="ph"><h1>المنتجات <span class="bd-s plain">' + P.length + '</span></h1><a class="btn brand" href="#/product/new"><span data-i="plus"></span>إضافة منتج</a></div>' +
    '<div class="card" style="overflow:hidden">' +
      '<div class="toolbar"><input class="in" id="plQ" type="search" placeholder="ابحث بالاسم…" value="' + esc(PL.q) + '"><select id="plCat"><option value="">كل الفئات</option>' + cats.map(c => '<option' + (c === PL.cat ? ' selected' : '') + '>' + esc(c) + '</option>').join('') + '</select></div>' +
      '<div class="fchips" id="plF">' + F.map(([k, l, fn]) => '<button data-f="' + k + '" class="' + (PL.f === k ? 'on' : '') + '">' + l + '<em>' + P.filter(fn).length + '</em></button>').join('') + '</div>' +
      '<div class="bulk hide" id="plBulk"><span id="plSelN"></span><button class="btn sm" data-b="show">إظهار</button><button class="btn sm" data-b="hide">إخفاء</button><button class="btn sm" data-b="sale">تخفيض %</button><button class="btn sm" data-b="unsale">إلغاء التخفيض</button><button class="btn sm" data-b="cat">نقل لفئة</button><button class="btn sm danger" data-b="del">حذف</button></div>' +
      '<div id="plList"></div>' +
    '</div>';
  const draw = () => {
    const fn = (F.find(x => x[0] === PL.f) || F[0])[2], q = PL.q.trim().toLowerCase();
    const list = P.filter(p => fn(p) && (!PL.cat || p.category === PL.cat) && (!q || (p.name + ' ' + (p.category || '')).toLowerCase().includes(q))).slice().reverse();
    $('plList').innerHTML = list.length ? list.map(p => rowHTML(p, PL.sel.has(p.id))).join('')
      : (P.length ? '<div class="empty">' + I.box + '<b>لا توجد منتجات مطابقة</b>غيّر الفلتر أو كلمة البحث.</div>'
                  : '<div class="empty">' + I.box + '<b>لا توجد منتجات بعد</b>أضف أول منتج ليظهر في متجرك.<br><br><a class="btn brand" href="#/product/new">إضافة منتج</a></div>');
    $('plBulk').classList.toggle('hide', !PL.sel.size);
    $('plSelN').textContent = PL.sel.size + ' محدد';
  };
  draw();
  $('plQ').addEventListener('input', e => { PL.q = e.target.value; draw(); });
  $('plCat').addEventListener('change', e => { PL.cat = e.target.value; draw(); });
  $('plF').addEventListener('click', e => { const b = e.target.closest('[data-f]'); if (!b) return; PL.f = b.dataset.f; $('plF').querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b)); draw(); });
  $('plList').addEventListener('click', e => {
    const cb = e.target.closest('[data-sel]');
    if (cb){ e.stopPropagation(); cb.checked ? PL.sel.add(cb.dataset.sel) : PL.sel.delete(cb.dataset.sel); $('plBulk').classList.toggle('hide', !PL.sel.size); $('plSelN').textContent = PL.sel.size + ' محدد'; return; }
    const r = e.target.closest('.pr'); if (r) go('#/product/' + encodeURIComponent(r.dataset.id));
  });
  $('plBulk').addEventListener('click', async e => {
    const b = e.target.closest('[data-b]'); if (!b) return;
    const ids = new Set(PL.sel), act = b.dataset.b;
    let fn = null, msg = '';
    if (act === 'show'){ fn = p => { p.status = 'active'; }; msg = 'إظهار منتجات'; }
    if (act === 'hide'){ fn = p => { p.status = 'hidden'; }; msg = 'إخفاء منتجات'; }
    if (act === 'unsale'){ fn = p => { if (onSale(p)){ p.price = num(p.old_price); p.old_price = null; } }; msg = 'إلغاء تخفيض'; }
    if (act === 'sale'){
      const pc = parseInt(prompt('نسبة التخفيض (مثال: 20)', '20'), 10); if (!(pc > 0 && pc < 95)) return;
      fn = p => { const base = onSale(p) ? num(p.old_price) : num(p.price); p.old_price = base; p.price = Math.round(base * (1 - pc / 100) / 50) * 50; };
      msg = 'تخفيض ' + pc + '%';
    }
    if (act === 'cat'){ const c = prompt('اسم الفئة الجديدة:', PL.cat || ''); if (!c || !c.trim()) return; fn = p => { p.category = c.trim(); }; msg = 'نقل منتجات إلى ' + c; }
    if (act === 'del'){
      if (!await ask('حذف ' + ids.size + ' منتج؟', 'لا يمكن التراجع عن الحذف.', 'حذف', true)) return;
      busy(b, true, '');
      try { await saveProducts(items => items.filter(p => !ids.has(p.id)), 'حذف ' + ids.size + ' منتج'); PL.sel.clear(); toast('تم الحذف'); pageProducts(); paintIcons($('view')); }
      catch(err){ toast('تعذّر الحذف، حاول مجددًا', 1); busy(b, false); }
      return;
    }
    if (!fn) return;
    busy(b, true, '');
    try { await saveProducts(items => { items.forEach(p => { if (ids.has(p.id)) fn(p); }); }, msg); PL.sel.clear(); toast('تم التحديث'); pageProducts(); paintIcons($('view')); }
    catch(err){ toast('تعذّر الحفظ، حاول مجددًا', 1); busy(b, false); }
  });
}

function toDraft(p){
  const sizes = listOf(p.sizes), ss = p.size_stock || {};
  const hasSS = sizes.some(s => ss[s] !== undefined && ss[s] !== null && ss[s] !== '');
  const hex = p.color_hex || {};
  return {
    id: p.id, name: p.name || '', description: p.description || '', category: p.category || '',
    price: p.price || '', old_price: p.old_price || '',
    images: imgsOf(p), status: p.status || 'active', featured: !!p.featured, badge: p.badge || '',
    sizes: sizes.map(s => ({name: s, stock: hasSS ? (ss[s] ?? '') : ''})),
    colors: listOf(p.colors).map(c => ({name: c, hex: hex[c] || (COLOR_PRESETS.find(x => x[0] === c) || [])[1] || '#cccccc'})),
    track: hasSS ? 'size' : (hasStock(p) ? 'total' : 'none'),
    stock: hasStock(p) ? p.stock : '',
    created: p.created || ''
  };
}
function fromDraft(d){
  const sizes = d.sizes.map(s => s.name);
  const out = {
    id: d.id || ('p' + Date.now().toString(36)),
    name: d.name.trim(), category: d.category.trim(),
    price: num(d.price), old_price: num(d.old_price) > num(d.price) ? num(d.old_price) : null,
    image: d.images[0] || '', images: d.images.slice(),
    sizes, colors: d.colors.map(c => c.name),
    stock: null, description: d.description.trim(),
    status: d.status, featured: !!d.featured, badge: d.badge.trim(),
    created: d.created || new Date().toISOString()
  };
  if (d.colors.length) out.color_hex = Object.fromEntries(d.colors.map(c => [c.name, c.hex]));
  if (d.track === 'total') out.stock = Math.max(0, parseInt(d.stock, 10) || 0);
  if (d.track === 'size' && sizes.length){
    out.size_stock = Object.fromEntries(d.sizes.map(s => [s.name, Math.max(0, parseInt(s.stock, 10) || 0)]));
    out.stock = Object.values(out.size_stock).reduce((a, b) => a + b, 0);
  }
  return out;
}

  let dragFrom = null;
  function drawMedia(){
    V('eMedia').innerHTML = d.images.map((s, i) => '<div class="mi' + (i ? '' : ' first') + '" draggable="true" data-i="' + i + '"><img src="' + esc(src(s)) + '" alt=""><div class="tools"><button type="button" data-rm="' + i + '" title="حذف">' + I.x + '</button>' + (i ? '<button type="button" data-main="' + i + '" title="اجعلها الرئيسية">' + I.star + '</button>' : '') + '</div>' + (i ? '' : '<span class="main-t">الرئيسية</span>') + '</div>').join('') +
      '<label class="drop" id="eDrop">' + I.img + '<span>إضافة صور</span><input type="file" accept="image/*" multiple id="eFiles"></label>';
    V('eFiles').onchange = e => addFiles(e.target.files);
    const dz = V('eDrop');
    dz.ondragover = e => { e.preventDefault(); dz.classList.add('over'); };
    dz.ondragleave = () => dz.classList.remove('over');
    dz.ondrop = e => { e.preventDefault(); dz.classList.remove('over'); if (e.dataTransfer.files.length) addFiles(e.dataTransfer.files); };
  }
  async function addFiles(files){
    for (const f of files){
      if (!f.type.startsWith('image/')) continue;
      try { d.images.push(await shrink(f)); } catch(e){ toast('تعذّرت قراءة صورة: ' + f.name, 1); }
    }
    drawMedia(); changed();
  }
  V('eMedia').addEventListener('click', e => {
    const rm = e.target.closest('[data-rm]'), mn = e.target.closest('[data-main]');
    if (rm){ e.preventDefault(); d.images.splice(+rm.dataset.rm, 1); drawMedia(); changed(); }
    if (mn){ e.preventDefault(); const [x] = d.images.splice(+mn.dataset.main, 1); d.images.unshift(x); drawMedia(); changed(); }
  });
  V('eMedia').addEventListener('dragstart', e => { const m = e.target.closest('.mi'); if (m){ dragFrom = +m.dataset.i; m.classList.add('drag'); } });
  V('eMedia').addEventListener('dragend', e => { V('eMedia').querySelectorAll('.mi').forEach(m => m.classList.remove('drag', 'over')); });
  V('eMedia').addEventListener('dragover', e => { const m = e.target.closest('.mi'); if (m && dragFrom !== null){ e.preventDefault(); V('eMedia').querySelectorAll('.mi').forEach(x => x.classList.toggle('over', x === m)); } });
  V('eMedia').addEventListener('drop', e => { const m = e.target.closest('.mi'); if (m && dragFrom !== null){ e.preventDefault(); const to = +m.dataset.i; const [x] = d.images.splice(dragFrom, 1); d.images.splice(to, 0, x); dragFrom = null; drawMedia(); changed(); } });

  /* المقاسات */
  function drawSizes(){
    V('eSizes').querySelectorAll('.t').forEach(x => x.remove());
    V('eSizeIn').insertAdjacentHTML('beforebegin', d.sizes.map((s, i) => '<span class="t">' + esc(s.name) + '<button type="button" data-sx="' + i + '" aria-label="حذف">' + I.x + '</button></span>').join(''));
    drawStock();
  }
  function addSize(v){
    listOf(v).forEach(n => { if (!d.sizes.some(s => s.name === n)) d.sizes.push({name: n, stock: ''}); });
    drawSizes(); changed();
  }
  V('eSizeIn').addEventListener('keydown', e => {
    if (e.key === 'Enter' || e.key === ',' || e.key === '،'){ e.preventDefault(); if (e.target.value.trim()){ addSize(e.target.value); e.target.value = ''; } }
    else if (e.key === 'Backspace' && !e.target.value && d.sizes.length){ d.sizes.pop(); drawSizes(); changed(); }
  });
  V('eSizeIn').addEventListener('input', e => { if (/[,،]/.test(e.target.value)){ addSize(e.target.value); e.target.value = ''; } });
  V('eSizeIn').addEventListener('blur', e => { if (e.target.value.trim()){ addSize(e.target.value); e.target.value = ''; } });
  V('eSizes').addEventListener('click', e => { const x = e.target.closest('[data-sx]'); if (x){ d.sizes.splice(+x.dataset.sx, 1); drawSizes(); changed(); } else V('eSizeIn').focus(); });
  V('eSizePre').addEventListener('click', e => { const b = e.target.closest('[data-p]'); if (b) addSize(SIZE_PRESETS[+b.dataset.p][1].join(',')); });

  /* الألوان */
  function drawColors(){
    V('eColors').innerHTML = d.colors.map((c, i) => '<div class="crow"><input type="color" value="' + esc(c.hex) + '" data-ch="' + i + '" aria-label="اختر اللون"><input class="in" value="' + esc(c.name) + '" data-cn="' + i + '" placeholder="اسم اللون"><button type="button" data-cx="' + i + '" aria-label="حذف">' + I.trash + '</button></div>').join('') ||
      '<div class="muted">لا توجد ألوان. اختر من الألوان الجاهزة بالأسفل، أو اتركها فارغة.</div>';
  }
  V('eColors').addEventListener('input', e => {
    const h = e.target.dataset.ch, n = e.target.dataset.cn;
    if (h !== undefined) d.colors[+h].hex = e.target.value;
    if (n !== undefined) d.colors[+n].name = e.target.value;
    changed();
  });
  V('eColors').addEventListener('click', e => { const x = e.target.closest('[data-cx]'); if (x){ d.colors.splice(+x.dataset.cx, 1); drawColors(); changed(); } });
  V('eColPre').addEventListener('click', e => {
    const b = e.target.closest('[data-h]'); if (!b) return;
    if (b.dataset.c && d.colors.some(c => c.name === b.dataset.c)) return toast('هذا اللون موجود');
    d.colors.push({name: b.dataset.c, hex: b.dataset.h}); drawColors(); changed();
    if (!b.dataset.c){ const l = V('eColors').querySelectorAll('[data-cn]'); l[l.length - 1].focus(); }
  });

  /* المخزون */
  function drawStock(){
    V('eTrack').querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.t === d.track));
    const box = V('eStockBox');
    if (d.track === 'none') box.innerHTML = '<div class="muted">لن يظهر «نفدت الكمية» أبدًا. مناسب إذا كنت تجلب السلعة عند الطلب.</div>';
    else if (d.track === 'total') box.innerHTML = '<div class="f"><label for="eStock">الكمية المتوفرة</label><input id="eStock" type="number" inputmode="numeric" min="0" value="' + esc(d.stock) + '"><div class="hint">ضع 0 ليظهر «نفدت الكمية». عند 5 أو أقل يظهر «بقيت قطع قليلة».</div></div>';
    else if (!d.sizes.length) box.innerHTML = '<div class="muted">أضف المقاسات أولًا، ثم ضع كمية كل مقاس.</div>';
    else box.innerHTML = '<table class="vt"><tr><th>المقاس</th><th>الكمية</th></tr>' + d.sizes.map((s, i) => '<tr><td><b>' + esc(s.name) + '</b></td><td><input type="number" inputmode="numeric" min="0" data-ss="' + i + '" value="' + esc(s.stock) + '" placeholder="0"></td></tr>').join('') + '</table><div class="hint">المقاس الذي كميته 0 يظهر للزبونة مشطوبًا ولا يمكن طلبه.</div>';
    const st = V('eStock'); if (st) st.addEventListener('input', e => { d.stock = e.target.value; changed(); });
  }
  V('eTrack').addEventListener('click', e => { const b = e.target.closest('[data-t]'); if (b){ d.track = b.dataset.t; drawStock(); changed(); } });
  V('eStockBox').addEventListener('input', e => { const i = e.target.dataset.ss; if (i !== undefined){ d.sizes[+i].stock = e.target.value; changed(); } });

  async function save(){
    const okName = !!d.name.trim(), okPrice = num(d.price) > 0;
    V('eNameF').classList.toggle('bad', !okName); V('ePriceF').classList.toggle('bad', !okPrice);
    if (!okName || !okPrice){ toast('أكمل الحقول المطلوبة', 1); (okName ? V('ePrice') : V('eName')).focus(); throw new Error('invalid'); }
    const btn = V('eSave'); busy(btn, true);
    try {
      const imgs = [];
      for (let i = 0; i < d.images.length; i++){
        const s = d.images[i];
        if (s.startsWith('data:')){ btn.innerHTML = '<span class="spin"></span>رفع الصور ' + (i + 1) + '/' + d.images.length; imgs.push(await uploadImage(s)); }
        else imgs.push(s);
      }
      d.images = imgs;
      btn.innerHTML = '<span class="spin"></span>جارٍ الحفظ';
      const p = fromDraft(d);
      await saveProducts(items => { const k = items.findIndex(x => x.id === p.id || (!x.id && !isNew && x.name === orig.name)); if (k >= 0) items[k] = p; else items.push(p); }, (isNew ? 'إضافة' : 'تعديل') + ' منتج: ' + p.name);
      setDirty(null);
      toast(isNew ? 'أُضيف المنتج، يظهر في المتجر خلال دقيقة' : 'تم حفظ التغييرات');
      if (isNew) go('#/product/' + encodeURIComponent(p.id)); else { pageEditor(p.id); paintIcons($('view')); }
    } catch(e){ if (e.message !== 'invalid'){ toast('تعذّر الحفظ. تحقق من الاتصال وحاول مجددًا', 1); console.error(e); } busy(btn, false); throw e; }
  }
  V('eSave').addEventListener('click', () => save().catch(() => {}));
  const del = V('eDel');
  if (del) del.addEventListener('click', async () => {
    if (!await ask('حذف «' + orig.name + '»؟', 'سيختفي من المتجر نهائيًا. يمكنك بدلًا من ذلك إخفاؤه مؤقتًا.', 'حذف', true)) return;
    busy(del, true, 'حذف');
    try { await saveProducts(items => items.filter(x => x.id !== orig.id), 'حذف منتج: ' + orig.name); setDirty(null); toast('تم حذف المنتج'); go('#/products'); }
    catch(e){ toast('تعذّر الحذف', 1); busy(del, false); }
  });
  drawMedia(); drawSizes(); drawColors(); preview();
}

function pageCategories(){
  let cats = clone(DB.categories);
  const used = [...new Set(DB.products.map(p => p.category).filter(Boolean))];
  used.forEach(n => { if (!cats.some(c => c.name === n)) cats.push({name: n, _auto: true}); });
  const snap = JSON.stringify(cats);
  const count = n => DB.products.filter(p => p.category === n).length;
  $('view').innerHTML = '<div class="ph"><h1>الفئات</h1><button class="btn brand" id="cAdd"><span data-i="plus"></span>فئة جديدة</button><div class="sub">تظهر الفئات كدوائر ستوري في أعلى المتجر بهذا الترتيب. اضغط على الدائرة لتغيير صورتها.</div></div>' +
    '<div class="card" id="cList"></div>';
  const draw = () => {
    $('cList').innerHTML = cats.length ? cats.map((c, i) => '<div class="cr"><label class="ci">' + (c.image ? '<img src="' + esc(src(c.image)) + '" alt="">' : 'صورة') + '<input type="file" accept="image/*" data-ci="' + i + '"></label>' +
      '<input class="in" data-cn="' + i + '" value="' + esc(c.name) + '" placeholder="اسم الفئة"><small>' + count(c.name) + ' منتج</small>' +
      '<label class="tg" title="ظاهرة في المتجر"><input type="checkbox" data-cv="' + i + '"' + (c.hidden ? '' : ' checked') + '><span></span></label>' +
      '<div class="ord"><button type="button" data-cu="' + i + '" aria-label="أعلى">' + I.up + '</button><button type="button" data-cd="' + i + '" aria-label="أسفل">' + I.down + '</button></div>' +
      '<button class="btn ghost sm" data-cx="' + i + '" aria-label="حذف">' + I.trash + '</button></div>').join('')
      : '<div class="empty">' + I.tag + '<b>لا توجد فئات</b>أضف فئات مثل: فساتين، عبايات، رضّع.</div>';
  };
  const changed = () => setDirty(JSON.stringify(cats) !== snap ? {save, discard: () => { pageCategories(); paintIcons($('view')); }} : null);
  async function save(){
    const valid = cats.filter(c => c.name.trim());
    const items = [];
    for (const c of valid){
      const it = {name: c.name.trim()};
      if (c.image) it.image = c.image.startsWith('data:') ? await uploadImage(c.image, 'images/categories') : c.image;
      if (c.hidden) it.hidden = true;
      items.push(it);
    }
    try { await writeJSON('data/categories.json', {items}, 'تحديث الفئات'); DB.categories = items; setDirty(null); toast('تم حفظ الفئات'); pageCategories(); paintIcons($('view')); }
    catch(e){ toast('تعذّر الحفظ', 1); throw e; }
  }
  draw();
  $('cAdd').addEventListener('click', () => { cats.push({name: ''}); draw(); changed(); const l = $('cList').querySelectorAll('[data-cn]'); l[l.length - 1].focus(); });
  $('cList').addEventListener('input', e => { const i = e.target.dataset.cn; if (i !== undefined){ cats[+i].name = e.target.value; changed(); } });
  $('cList').addEventListener('change', async e => {
    const i = e.target.dataset.ci, v = e.target.dataset.cv;
    if (i !== undefined && e.target.files[0]){ cats[+i].image = await shrink(e.target.files[0], 600); draw(); changed(); }
    if (v !== undefined){ cats[+v].hidden = !e.target.checked; changed(); }
  });
  $('cList').addEventListener('click', async e => {
    const u = e.target.closest('[data-cu]'), dn = e.target.closest('[data-cd]'), x = e.target.closest('[data-cx]');
    if (u && +u.dataset.cu > 0){ const i = +u.dataset.cu; [cats[i - 1], cats[i]] = [cats[i], cats[i - 1]]; draw(); changed(); }
    if (dn && +dn.dataset.cd < cats.length - 1){ const i = +dn.dataset.cd; [cats[i + 1], cats[i]] = [cats[i], cats[i + 1]]; draw(); changed(); }
    if (x){
      const c = cats[+x.dataset.cx], n = count(c.name);
      if (n && !await ask('حذف فئة «' + c.name + '»؟', 'فيها ' + n + ' منتج. ستبقى المنتجات لكن بدون دائرة فئة في الأعلى.', 'حذف', true)) return;
      cats.splice(+x.dataset.cx, 1); draw(); changed();
    }
  });
}

      '<button class="btn sm" data-a="+50">+50 دج للكل</button><button class="btn sm" data-a="-50">-50 دج للكل</button><button class="btn sm" data-a="dhd">إعادة أسعار DHD</button><button class="btn sm" data-a="add">+ ولاية</button>' +

    '<div class="st-row h"><span>الولاية</span><span style="text-align:center">المنزل</span><span style="text-align:center">المكتب</span><span></span></div><div id="shList"></div></div>' +

  const draw = () => {
    const q = ($('shQ').value || '').trim();
    $('shList').innerHTML = rows.map((w, i) => (!q || w.wilaya.includes(q) || String(w.code) === q) ?
      '<div class="st-row' + (w.enabled === false ? ' off' : '') + '"><span>' + (w.code ? String(w.code).padStart(2, '0') + ' ' : '') + esc(w.wilaya) + (w.is_new ? ' <small>جديدة</small>' : '') + '</span>' +
      '<input type="number" inputmode="numeric" data-h="' + i + '" value="' + esc(w.home_price) + '"><input type="number" inputmode="numeric" data-o="' + i + '" value="' + esc(w.office_price) + '">' +
      '<label class="tg"><input type="checkbox" data-e="' + i + '"' + (w.enabled === false ? '' : ' checked') + '><span></span></label></div>' : '').join('');
  };
  const changed = () => setDirty(JSON.stringify(rows) !== snap || !DB.shipSaved ? {save, discard: () => { pageShipping(); paintIcons($('view')); }} : null);

    try { await writeJSON('data/shipping.json', {version: 2, items: rows}, 'تحديث أسعار التوصيل'); DB.shipping = rows; DB.shipSaved = true; setDirty(null); toast('تم حفظ أسعار التوصيل'); pageShipping(); paintIcons($('view')); }

    const h = e.target.dataset.h, o = e.target.dataset.o;
    if (h !== undefined) rows[+h].home_price = num(e.target.value);

    busy(b, false);
  });
}

async function saveSettings(patch){
  const fresh = (await readJSON('data/settings.json')) || {};
  const next = Object.assign({}, fresh, patch);
  Object.keys(next).forEach(k => { if (next[k] === null) delete next[k]; });
  await writeJSON('data/settings.json', next, 'تحديث إعدادات المتجر');
  DB.settings = next; applyBrand();
}

    '</div></div>' +
    '<div class="card"><div class="hd"><h2>الشريط المتحرك أعلى المتجر</h2></div><div class="bd"><div class="f"><textarea data-k="announcements" rows="4"></textarea><div class="hint">كل سطر عبارة. مثال: «تخفيضات العيد حتى 30%».</div></div></div></div>' +
    '<div class="card"><div class="hd"><h2>الواجهة (أول ستوري)</h2></div><div class="bd">' +
      '<div class="g2"><div class="f"><label>العنوان الكبير</label><input data-k="hero_title"></div><div class="f"><label>السطر الثاني</label><input data-k="hero_title_2"></div></div>' +
      '<div class="f"><label>النص</label><textarea data-k="hero_text" rows="2" style="min-height:60px"></textarea></div>' +
      '<div class="f"><label>نص الزر</label><input data-k="hero_button"></div>' +
      '<div class="hint">بعد هذه الشريحة تظهر المنتجات التي وضعتها «مميّزة» في محرر المنتج.</div>' +
    '</div></div>' +
    '<div class="card"><div class="hd"><h2>الأسئلة المتكررة</h2><button class="btn sm" id="dFqAdd">+ سؤال</button></div><div class="bd" id="dFaq"></div></div>' +
    '<div class="card"><div class="hd"><h2>نصوص صفحة المنتج</h2></div><div class="bd">' +
      '<div class="f"><label>دليل المقاسات</label><textarea data-k="size_guide" rows="4" placeholder="مثال:\nS: الصدر 86 سم، الطول 140 سم\nM: الصدر 92 سم…"></textarea><div class="hint">يظهر كقسم «دليل المقاسات» في كل منتج له مقاسات. اتركه فارغًا لإخفائه.</div></div>' +
      '<div class="f"><label>التوصيل والاستبدال</label><textarea data-k="delivery_text" rows="3" placeholder="مثال: التوصيل خلال 2 إلى 5 أيام. الاستبدال خلال 3 أيام من الاستلام."></textarea></div>' +
    '</div></div>' +
    '</div><div class="aside"><div class="card"><div class="hd"><h2>أقسام الصفحة الرئيسية</h2></div><div class="bd">' +
      SECTIONS.map(([k, l]) => '<div class="sw"><div><b>' + l + '</b></div><label class="tg"><input type="checkbox" data-sec="' + k + '"><span></span></label></div>').join('') +
    '</div></div></div></div>';
  const V = $('view');
  V.querySelectorAll('[data-k]').forEach(el => { el.value = d[el.dataset.k]; el.addEventListener('input', () => { d[el.dataset.k] = el.value; changed(); }); });
  V.querySelectorAll('[data-sec]').forEach(el => { el.checked = d.sections[el.dataset.sec] !== false; el.addEventListener('change', () => { d.sections[el.dataset.sec] = el.checked; changed(); }); });
  const drawLogo = () => { $('dLogoP').innerHTML = d.logo ? '<img src="' + esc(src(d.logo)) + '" alt="">' : 'لا يوجد'; };
  const drawAcc = () => $('dAcc').querySelectorAll('[data-c]').forEach(b => b.classList.toggle('on', b.dataset.c.toLowerCase() === d.accent.toLowerCase()));
  const drawFaq = () => {
    $('dFaq').innerHTML = d.faq.map((f, i) => '<div class="fq"><input class="in" data-fq="' + i + '" value="' + esc(f.q) + '" placeholder="السؤال"><textarea class="in" data-fa="' + i + '" placeholder="الجواب">' + esc(f.a) + '</textarea><div class="r"><button class="btn ghost sm" data-fu="' + i + '">' + I.up + '</button><button class="btn ghost sm" data-fx="' + i + '">' + I.trash + '</button></div></div>').join('') || '<div class="muted">لا توجد أسئلة. القسم سيختفي من المتجر.</div>';
  };
  drawLogo(); drawAcc(); drawFaq();
  $('dLogo').addEventListener('change', async e => { if (e.target.files[0]){ d.logo = await shrink(e.target.files[0], 500, .9); drawLogo(); changed(); } });
  $('dLogoX').addEventListener('click', () => { d.logo = ''; drawLogo(); changed(); });
  $('dAcc').addEventListener('click', e => { const b = e.target.closest('[data-c]'); if (b){ d.accent = b.dataset.c; drawAcc(); changed(); } });
  $('dAccC').addEventListener('input', e => { d.accent = e.target.value; drawAcc(); changed(); });
  $('dFqAdd').addEventListener('click', () => { d.faq.push({q: '', a: ''}); drawFaq(); changed(); });
  $('dFaq').addEventListener('input', e => { const q = e.target.dataset.fq, a = e.target.dataset.fa; if (q !== undefined) d.faq[+q].q = e.target.value; if (a !== undefined) d.faq[+a].a = e.target.value; changed(); });
  $('dFaq').addEventListener('click', e => {
    const u = e.target.closest('[data-fu]'), x = e.target.closest('[data-fx]');
    if (u && +u.dataset.fu > 0){ const i = +u.dataset.fu; [d.faq[i - 1], d.faq[i]] = [d.faq[i], d.faq[i - 1]]; }
    else if (x) d.faq.splice(+x.dataset.fx, 1); else return;
    drawFaq(); changed();
  });
  function changed(){ setDirty(JSON.stringify(d) !== snap ? {save, discard: () => { pageDesign(); paintIcons($('view')); }} : null); }
  async function save(){
    try {
      let logo = d.logo;
      if (logo && logo.startsWith('data:')) logo = await uploadImage(logo, 'images');
      await saveSettings({
        store_name: d.store_name.trim() || null, tagline: d.tagline.trim() || null, logo: logo || null, accent: d.accent,
        announcements: d.announcements.split('\n').map(x => x.trim()).filter(Boolean),
        hero_title: d.hero_title.trim() || null, hero_title_2: d.hero_title_2.trim() || null, hero_text: d.hero_text.trim() || null, hero_button: d.hero_button.trim() || null,
        sections: d.sections, faq: d.faq.filter(f => f.q.trim() && f.a.trim()),
        size_guide: d.size_guide.trim() || null, delivery_text: d.delivery_text.trim() || null
      });
      setDirty(null); toast('تم الحفظ، يظهر في المتجر خلال دقيقة'); pageDesign(); paintIcons($('view'));
    } catch(e){ toast('تعذّر الحفظ', 1); throw e; }
  }
}

/* =====================================================================
   الإعدادات
   ===================================================================== */
function pageSettings(){
  const F = [
    ['الطلبات والتواصل', [['whatsapp_number', 'رقم واتساب استقبال الطلبات', '213540420476', 'بالصيغة الدولية بدون + ولا مسافات. على هذا الرقم تصلك الطلبات.'], ['phone_display', 'رقم الهاتف الظاهر في المتجر', '0540 42 04 76'], ['email', 'البريد الإلكتروني', '']]],
    ['الشبكات الاجتماعية', [['facebook_url', 'فيسبوك', 'https://www.facebook.com/…'], ['messenger_url', 'ماسنجر', 'https://m.me/…'], ['instagram_url', 'إنستغرام', 'https://www.instagram.com/…'], ['tiktok_url', 'تيك توك', 'https://www.tiktok.com/@…']]],
    ['الإعلانات والتتبع', [['pixel_id', 'Meta Pixel ID', '1144683181624951', 'يسجّل المشاهدات والإضافة للسلة والطلبات لتحسين إعلانات فيسبوك.'], ['pixel_order_event', 'الحدث عند إرسال الطلب', 'Purchase', 'Purchase أو Lead']]]
  ];
  let d = {}; F.forEach(g => g[1].forEach(([k]) => d[k] = DB.settings[k] || ''));
  const snap = JSON.stringify(d);
  $('view').innerHTML = '<div class="ph"><h1>الإعدادات</h1></div>' +
    F.map(([t, fs]) => '<div class="card"><div class="hd"><h2>' + t + '</h2></div><div class="bd">' + fs.map(([k, l, ph, h]) => '<div class="f"><label>' + l + '</label><input data-k="' + k + '" dir="ltr" placeholder="' + esc(ph) + '">' + (h ? '<div class="hint">' + h + '</div>' : '') + '</div>').join('') + '</div></div>').join('') +
    '<div class="card"><div class="hd"><h2>الحساب</h2></div><div class="bd"><div class="muted" style="margin-bottom:10px">المستودع: ' + REPO + '</div><button class="btn danger" id="sOut"><span data-i="logout"></span>تسجيل الخروج</button></div></div>';
  $('view').querySelectorAll('[data-k]').forEach(el => { el.value = d[el.dataset.k]; el.addEventListener('input', () => { d[el.dataset.k] = el.value; setDirty(JSON.stringify(d) !== snap ? {save, discard: () => { pageSettings(); paintIcons($('view')); }} : null); }); });
  $('sOut').addEventListener('click', () => $('logout2').click());
  async function save(){
    const patch = {}; Object.keys(d).forEach(k => patch[k] = String(d[k]).trim() || null);
    if (patch.whatsapp_number) patch.whatsapp_number = patch.whatsapp_number.replace(/\D/g, '').replace(/^0/, '213');
    try { await saveSettings(patch); setDirty(null); toast('تم حفظ الإعدادات'); pageSettings(); paintIcons($('view')); }
    catch(e){ toast('تعذّر الحفظ', 1); throw e; }
  }
}

/* ---------- البداية ---------- */
async function boot(){
  $('login').classList.add('hide'); $('app').classList.remove('hide');
  paintIcons();
  try { await loadAll(); route(); }
  catch(e){ if (e.message !== '401') $('view').innerHTML = '<div class="empty">' + I.alert + '<b>تعذّر تحميل بيانات المتجر</b>تأكد أن حسابك على GitHub له صلاحية على المستودع ' + REPO + '.<br><br><button class="btn" onclick="location.reload()">إعادة المحاولة</button></div>'; }
}
paintIcons();
if (token) boot(); else $('login').classList.remove('hide');

</script>
