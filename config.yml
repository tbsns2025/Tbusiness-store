backend:
  name: github
  repo: tbsns2025/Tbusiness-store
  branch: main
  base_url: https://tbusiness-store.ppc058967.workers.dev
  auth_endpoint: api/auth

media_folder: "images/products"
public_folder: "/images/products"

collections:
  - name: "products"
    label: "المنتجات"
    label_singular: "منتج"
    files:
      - file: "data/products.json"
        label: "قائمة المنتجات"
        name: "products"
        fields:
          - label: "المنتجات"
            name: "items"
            widget: "list"
            label_singular: "منتج"
            fields:
              - label: "اسم المنتج"
                name: "name"
                widget: "string"
              - label: "الفئة"
                name: "category"
                widget: "select"
                options:
                  - "إلكترونيات"
                  - "أزياء"
                  - "المنزل والمطبخ"
                  - "الجمال والعناية"
                  - "الرياضة"
                  - "الألعاب"
              - label: "السعر (دج)"
                name: "price"
                widget: "number"
                value_type: "int"
              - label: "السعر قبل الخصم (اختياري)"
                name: "old_price"
                widget: "number"
                value_type: "int"
                required: false
              - label: "صورة المنتج"
                name: "image"
                widget: "image"
                required: false
              - label: "وصف مختصر (اختياري)"
                name: "description"
                widget: "text"
                required: false

  - name: "shipping"
    label: "أسعار التوصيل"
    label_singular: "ولاية"
    files:
      - file: "data/shipping.json"
        label: "قائمة أسعار التوصيل"
        name: "shipping"
        fields:
          - label: "الولايات"
            name: "items"
            widget: "list"
            label_singular: "ولاية"
            fields:
              - label: "اسم الولاية"
                name: "wilaya"
                widget: "string"
              - label: "سعر التوصيل للمنزل (دج)"
                name: "home_price"
                widget: "number"
                value_type: "int"
              - label: "سعر التوصيل للمكتب (دج)"
                name: "office_price"
                widget: "number"
                value_type: "int"
