backend:
  name: github
  repo: tbsns2025/Tbusiness-store
  branch: main
  base_url: https://api.netlify.com
  auth_endpoint: auth

media_folder: "images/products"
public_folder: "images/products"

collections:
  - name: "products"
    label: "المنتجات"
    files:
      - file: "data/products.json"
        label: "قائمة المنتجات"
        name: "products"
        fields:
          - label: "المنتجات"
            name: "items"
            widget: "list"
            label_singular: "منتج"
            summary: "{{fields.name}} — {{fields.price}} دج"
            fields:
              - {label: "المعرّف (لا تغيّره)", name: "id", widget: "string", required: false}
              - {label: "اسم المنتج", name: "name", widget: "string"}
              - label: "الفئة"
                name: "category"
                widget: "select"
                options: ["فساتين", "عبايات", "حقائب", "أحذية", "إكسسوارات", "بنات", "أولاد", "رضّع"]
              - {label: "السعر (دج)", name: "price", widget: "number", value_type: "int"}
              - {label: "السعر قبل التخفيض (اختياري)", name: "old_price", widget: "number", value_type: "int", required: false}
              - {label: "الصورة الرئيسية", name: "image", widget: "image", required: false}
              - label: "صور إضافية"
                name: "images"
                widget: "list"
                required: false
                field: {label: "صورة", name: "src", widget: "image"}
              - {label: "المقاسات", name: "sizes", widget: "list", required: false, hint: "مثال: S, M, L"}
              - {label: "الألوان", name: "colors", widget: "list", required: false, hint: "مثال: أسود, بيج"}
              - {label: "الكمية المتوفرة (0 = نفدت)", name: "stock", widget: "number", value_type: "int", required: false}
              - {label: "الوصف", name: "description", widget: "text", required: false}
              - {label: "الحالة", name: "status", widget: "select", options: [{label: "معروض", value: "active"}, {label: "مخفي", value: "hidden"}], default: "active", required: false}
              - {label: "منتج مميّز (يظهر في الستوري)", name: "featured", widget: "boolean", required: false}
              - {label: "شارة على الصورة", name: "badge", widget: "string", required: false}

  - name: "categories"
    label: "الفئات"
    files:
      - file: "data/categories.json"
        label: "قائمة الفئات"
        name: "categories"
        fields:
          - label: "الفئات"
            name: "items"
            widget: "list"
            label_singular: "فئة"
            fields:
              - {label: "اسم الفئة", name: "name", widget: "string"}
              - {label: "صورة الفئة (اختياري)", name: "image", widget: "image", required: false}

  - name: "shipping"
    label: "أسعار التوصيل"
    files:
      - file: "data/shipping.json"
        label: "أسعار التوصيل"
        name: "shipping"
        fields:
          - {label: "الإصدار (لا تغيّره)", name: "version", widget: "hidden", default: 2}
          - label: "الولايات"
            name: "items"
            widget: "list"
            label_singular: "ولاية"
            summary: "{{fields.wilaya}}: {{fields.home_price}} / {{fields.office_price}}"
            fields:
              - {label: "رقم الولاية", name: "code", widget: "number", value_type: "int", required: false}
              - {label: "اسم الولاية", name: "wilaya", widget: "string"}
              - {label: "التوصيل للمنزل (دج)", name: "home_price", widget: "number", value_type: "int"}
              - {label: "التوصيل للمكتب (دج) — 0 إذا لا يوجد مكتب", name: "office_price", widget: "number", value_type: "int"}
              - {label: "ولاية جديدة", name: "is_new", widget: "boolean", required: false}

  - name: "settings"
    label: "الإعدادات"
    files:
      - file: "data/settings.json"
        label: "إعدادات الموقع"
        name: "settings"
        fields:
          - {label: "رقم واتساب (بدون +)", name: "whatsapp_number", widget: "string", required: false}
          - {label: "رقم الهاتف الظاهر", name: "phone_display", widget: "string", required: false}
          - {label: "البريد الإلكتروني", name: "email", widget: "string", required: false}
          - {label: "فيسبوك", name: "facebook_url", widget: "string", required: false}
          - {label: "ماسنجر", name: "messenger_url", widget: "string", required: false}
          - {label: "إنستغرام", name: "instagram_url", widget: "string", required: false}
          - {label: "تيك توك", name: "tiktok_url", widget: "string", required: false}
          - {label: "Meta Pixel ID", name: "pixel_id", widget: "string", required: false}
